<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>maintainer-agent</title>
  <meta name="description" content="Sorts issues and PRs, flags low-effort AI pull requests, and drafts replies." />
  <script>
    try {
      var _t = localStorage.getItem("ma_theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", _t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  </script>
  <style>
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f1f0ec; --elevate: #ffffff;
      --border: #e6e4dd; --border-2: #d6d2c8;
      --text: #191917; --text-2: #57554e; --text-3: #94918a;
      --accent: #191917; --accent-2: #000000; --on-accent: #ffffff; --accent-weak: rgba(25,25,23,.12);
      --danger: #b3271a; --warning: #a5620a; --success: #12734a; --info: #4a6488; --neutral: #8b877f;
      --track: #eceae3;
      --shadow-lg: 0 18px 44px -22px rgba(20,20,25,.18);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0c0d10; --surface: #14161b; --surface-2: #1b1e24; --elevate: #16181e;
      --border: #24272f; --border-2: #30343d;
      --text: #ecedf1; --text-2: #a3a7b1; --text-3: #6c7079;
      --accent: #ededf0; --accent-2: #ffffff; --on-accent: #0c0d10; --accent-weak: rgba(237,237,240,.14);
      --danger: #ef6a5f; --warning: #e0a34d; --success: #4ac48a; --info: #86a2c8; --neutral: #8c919c;
      --track: #24272f;
      --shadow-lg: 0 22px 54px -26px rgba(0,0,0,.62);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55; -webkit-font-smoothing: antialiased; transition: background .3s ease, color .3s ease;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }

    header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: saturate(1.3) blur(10px); border-bottom: 1px solid var(--border); }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 0; gap: 16px; }
    .wordmark { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
      font-size: 15px; font-weight: 600; letter-spacing: -.01em; color: var(--text); }
    .wordmark .dim { color: var(--text-3); font-weight: 500; }
    .toggles { display: flex; align-items: center; gap: 8px; }
    .iconbtn { width: 34px; height: 30px; display: grid; place-items: center; border: 1px solid var(--border-2);
      border-radius: 7px; background: transparent; color: var(--text-2); cursor: pointer; transition: all .15s ease; }
    .iconbtn:hover { color: var(--text); border-color: var(--text-3); background: var(--surface-2); }
    .seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 7px; overflow: hidden; }
    .seg button { background: transparent; color: var(--text-2); border: 0; padding: 5px 11px; font-size: 12.5px;
      font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s ease; }
    .seg button + button { border-left: 1px solid var(--border-2); }
    .seg button.active { background: var(--accent); color: var(--on-accent); }
    .seg button:not(.active):hover { background: var(--surface-2); color: var(--text); }
    .sub { color: var(--text-2); font-size: 14px; margin: 14px 0 0; max-width: 60ch; }
    .controls { display: flex; gap: 10px; margin: 16px 0 0; flex-wrap: wrap; align-items: center; }
    input { background: var(--surface); border: 1px solid var(--border-2); color: var(--text);
      padding: 9px 13px; border-radius: 8px; font-size: 14px; min-width: 300px; font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease; }
    input::placeholder { color: var(--text-3); }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
    button.act { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent);
      padding: 9px 17px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; transition: all .15s ease; }
    button.act:hover { background: var(--accent-2); border-color: var(--accent-2); }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border-2);
      font-weight: 500; padding: 9px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; font-family: inherit; transition: all .15s ease; }
    button.ghost:hover { border-color: var(--text-3); background: var(--surface-2); }
    button:focus-visible, .iconbtn:focus-visible, .seg button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-weak); }
    .hint { color: var(--text-3); font-size: 12.5px; }
    .status { font-size: 12px; color: var(--text-3); padding: 14px 0 18px; }
    .status b { color: var(--text-2); font-weight: 600; }

    main { padding: 6px 0 72px; }
    .stats { display: flex; flex-wrap: wrap; padding: 30px 0 26px; border-bottom: 1px solid var(--border); }
    .stat { padding: 0 30px; }
    .stat:first-child { padding-left: 0; }
    .stat + .stat { border-left: 1px solid var(--border); }
    .stat .n { font-size: clamp(30px, 6.5vw, 40px); line-height: 1; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .stat.hot .n { color: var(--danger); }
    .stat .l { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-top: 9px; }

    .cols { display: grid; grid-template-columns: 1fr 340px; gap: 48px; align-items: start; }
    @media (max-width: 980px) { .cols { grid-template-columns: 1fr; gap: 28px; } }
    .col-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin: 26px 0 6px; }

    .list { margin-top: 4px; }
    .item { border-bottom: 1px solid var(--border); }
    .item:first-child { border-top: 1px solid var(--border); }
    .row { display: flex; align-items: center; gap: 13px; padding: 15px 14px; cursor: pointer; border-radius: 8px;
      transition: background .15s ease, box-shadow .15s ease; }
    .row:hover { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
    .item.open .row { background: var(--surface); box-shadow: inset 2px 0 0 var(--accent); }
    .num { font-size: 12.5px; color: var(--text-3); min-width: 50px; }
    .kind { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3);
      border: 1px solid var(--border-2); border-radius: 5px; padding: 2px 6px; }
    .title { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -.005em; color: var(--text); min-width: 0; }
    .meta { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .chev { color: var(--text-3); font-size: 17px; line-height: 1; transition: transform .18s ease; }
    .item.open .chev { transform: rotate(90deg); color: var(--accent); }

    .tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
    .tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neutral); flex-shrink: 0; }
    .t-danger .dot { background: var(--danger); } .t-warning .dot { background: var(--warning); }
    .t-success .dot { background: var(--success); } .t-info .dot { background: var(--info); }
    .t-neutral .dot { background: var(--neutral); }
    .meter { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--neutral); border-radius: 3px; transition: width .5s cubic-bezier(.2,.7,.2,1); }
    .t-danger .meter i { background: var(--danger); } .t-warning .meter i { background: var(--warning); }
    .t-success .meter i { background: var(--success); }
    .score { font-size: 12px; color: var(--text-3); min-width: 26px; text-align: right; }
    .pri { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
    .pri-high { color: var(--danger); } .pri-med { color: var(--warning); }

    .body { display: none; padding: 4px 16px 24px; }
    .item.open .body { display: block; animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-2);
      border-radius: 6px; padding: 3px 9px; font-size: 12px; color: var(--text-2); }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neutral); }
    .agent { padding: 13px 0; border-top: 1px solid var(--border); }
    .agent:first-of-type { border-top: 0; }
    .a-head { display: flex; align-items: center; gap: 10px; }
    .a-name { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
    .conf { font-size: 11px; color: var(--text-3); margin-left: auto; }
    .rationale { color: var(--text-2); font-size: 13.5px; margin: 6px 0; }
    .ev { color: var(--text-2); font-size: 12.5px; padding-left: 16px; position: relative; margin: 3px 0; }
    .ev::before { content: ""; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--border-2); }
    .ev .k { color: var(--text-3); }
    .ev .w.pos { color: var(--danger); } .ev .w.neg { color: var(--success); }
    .draft-label { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); margin: 16px 0 7px; font-weight: 600; }
    .draft { background: var(--surface-2); border: 1px solid var(--border); border-left: 2px solid var(--accent);
      border-radius: 8px; padding: 13px 15px; white-space: pre-wrap; font-size: 13.5px; color: var(--text); }
    .approval { font-size: 11px; color: var(--text-3); margin-top: 15px; }

    .panel { background: var(--elevate); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px 22px; position: sticky; top: 96px; box-shadow: var(--shadow-lg); }
    .panel h2 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin: 0 0 10px; }
    .md h3 { font-size: 15px; margin: 16px 0 4px; font-weight: 600; }
    .md h4 { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); margin: 15px 0 5px; }
    .md p { font-size: 13px; color: var(--text-2); margin: 4px 0; }
    .md ul { margin: 4px 0; padding-left: 16px; } .md li { font-size: 13px; color: var(--text-2); margin: 3px 0; }
    .md blockquote { border-left: 2px solid var(--border-2); margin: 8px 0; padding: 2px 12px; color: var(--text-2); font-style: italic; }
    .md a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .loading { color: var(--text-3); padding: 30px 4px; font-size: 14px; }
    footer { border-top: 1px solid var(--border); color: var(--text-3); font-size: 12.5px; padding: 22px 0 44px; margin-top: 8px; }
    footer a { color: var(--text-2); }

    @media (max-width: 640px) {
      .wrap { padding: 0 16px; }
      .topbar { padding-top: 16px; }
      input { flex: 1 1 200px; min-width: 0; }
      .stats { padding: 22px 0 18px; gap: 16px 22px; }
      .stat { padding: 0; }
      .stat + .stat { border-left: 0; }
      .cols { gap: 22px; }
      .panel { position: static; }
      .row { flex-wrap: wrap; gap: 8px 10px; padding: 14px 12px; position: relative; }
      .num { order: 1; } .kind { order: 2; }
      .title { order: 3; flex-basis: 100%; }
      .meta { order: 4; flex-basis: 100%; flex-wrap: wrap; gap: 8px 12px; }
      .chev { position: absolute; right: 10px; top: 15px; }
      .body { padding: 4px 12px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="topbar">
        <span class="wordmark">maintainer<span class="dim">-agent</span></span>
        <div class="toggles">
          <button class="iconbtn" id="theme" aria-label="Toggle theme"></button>
          <div class="seg" id="lang"><button data-lang="en">EN</button><button data-lang="zh">中文</button></div>
        </div>
      </div>
      <p class="sub" id="tagline"></p>
      <div class="controls">
        <input id="repo" aria-label="Repository" />
        <button id="go" class="act"></button>
        <button id="demo" class="ghost"></button>
        <span class="hint" id="hint"></span>
      </div>
      <div class="status mono" id="status"></div>
    </div>
  </header>

  <main class="wrap">
    <div class="stats" id="stats"></div>
    <div class="cols">
      <section>
        <div class="col-title" id="col-title"></div>
        <div class="list" id="items"></div>
      </section>
      <aside>
        <div class="panel"><h2 id="digest-title"></h2><div class="md" id="digest"></div></div>
      </aside>
    </div>
  </main>

  <footer class="wrap">
    <span id="footer-text"></span>
    <a href="https://github.com/0717lee/OSS-Maintainer-Assistant" target="_blank" rel="noopener" id="source-link"></a>
  </footer>

  <script>
    const I18N = {
      en: {
        tagline: "Triages your issues and pull requests, flags low-effort AI submissions, and drafts replies. You review and decide what to send.",
        placeholder: "owner/name  (leave blank to load sample data)",
        analyze: "Analyze", demo: "Sample data",
        hint: "Works on any public repo (no token needed).",
        listTitle: "Issues & pull requests", digestTitle: "Maintainer digest",
        footer: "Read-only. It never posts without your approval. ", source: "source",
        loading: "Analyzing…", loadingDemo: "Loading sample…",
        conf: "conf", draft: "Draft reply", proposed: "Suggested actions (you approve): ",
        st: { source: "source", backend: "backend", llm: "model", run: "run", items: "items" },
        stat: { reviewed: "reviewed", attention: "needs attention", duplicates: "duplicates",
          ready: "ready to review", good_first: "good first issue", more_info: "needs info" },
        errPre: "Couldn't load: ", errSuf: ". Check the name and try again, or use the sample.",
      },
      zh: {
        tagline: "帮你分诊 issue 和 PR，挑出低质的 AI 灌水提交，并起草回复。你来审阅，发什么由你决定。",
        placeholder: "owner/name（留空则加载示例数据）",
        analyze: "分析", demo: "示例数据",
        hint: "任意公开仓库都能用，不需要 token。",
        listTitle: "Issues 与 Pull Requests", digestTitle: "维护者摘要",
        footer: "只读。未经你批准，绝不发布。", source: "源码",
        loading: "分析中…", loadingDemo: "加载示例中…",
        conf: "置信", draft: "回复草稿", proposed: "建议动作（你来批准）：",
        st: { source: "来源", backend: "后端", llm: "模型", run: "运行", items: "条" },
        stat: { reviewed: "已审阅", attention: "需关注", duplicates: "疑似重复",
          ready: "待评审", good_first: "适合新手", more_info: "信息不足" },
        errPre: "加载失败：", errSuf: "。请检查名称后重试，或使用示例数据。",
      },
    };
    const VMAP_ZH = {
      "likely-ai-slop": "疑似 AI 灌水", "needs-work": "待完善", "looks-good": "良好", "duplicate": "重复",
      "security": "安全", "bug": "缺陷", "needs-more-info": "信息不足", "documentation": "文档",
      "enhancement": "增强", "question": "提问", "reproduced": "已复现", "not-reproduced": "未复现",
      "reply-drafted": "已拟回复", "not-applicable": "不适用", "needs-triage": "待分诊", "good first issue": "适合新手",
    };
    const PRI_ZH = { high: "高", medium: "中", low: "低", "-": "-" };
    const AGENT_ZH = { triage: "分诊", quality: "质量", reproducer: "复现", responder: "回复" };
    const TONE = {
      "likely-ai-slop": "danger", "security": "danger", "bug": "danger", "reproduced": "danger",
      "needs-work": "warning", "needs-more-info": "warning",
      "looks-good": "success", "not-reproduced": "success", "good first issue": "success",
      "duplicate": "info", "documentation": "info", "enhancement": "info", "question": "info",
      "reply-drafted": "neutral", "not-applicable": "neutral", "needs-triage": "neutral",
    };
    const state = { lang: "en", repo: "", data: null };
    const L = () => I18N[state.lang];
    const tone = (v) => TONE[v] || "neutral";
    const tV = (v) => (state.lang === "zh" ? (VMAP_ZH[v] || v) : v);
    const tPri = (p) => (state.lang === "zh" ? (PRI_ZH[p] || p) : p);
    const tAgent = (a) => (state.lang === "zh" ? (AGENT_ZH[a] || a) : a);
    const esc = (s) => (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const agent = (r, name) => (r.results.find(x => x.agent === name) || {}).decision;
    const action = (r, type) => r.actions.find(a => a.type === type);
    const tag = (v) => `<span class="tag t-${tone(v)}"><i class="dot"></i>${esc(tV(v))}</span>`;

    const effTheme = () => document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4l1.4-1.4M18 6l1.4-1.4"/></svg>';
    const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.4A8 8 0 1 1 9.6 4 6.5 6.5 0 0 0 20 14.4z"/></svg>';
    function paintThemeIcon() {
      const dark = effTheme() === "dark", b = document.getElementById("theme");
      b.innerHTML = dark ? SUN : MOON;
      b.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    }
    function toggleTheme() {
      const next = effTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("ma_theme", next); } catch (e) {}
      paintThemeIcon();
    }

    function renderMarkdown(md) {
      const lines = (md || "").split("\n");
      let html = "", inList = false;
      const inline = (t) => esc(t)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\[(.+?)\]\((.+?)\)/g, (m, t2, u) =>
          /^https?:\/\/[^"\s]+$/i.test(u) ? '<a href="' + u + '" target="_blank" rel="noopener">' + t2 + '</a>' : m)
        .replace(/_(.+?)_/g, "<em>$1</em>");
      for (const line of lines) {
        if (line.startsWith("## ")) { if (inList) { html += "</ul>"; inList = false; } html += "<h4>" + inline(line.slice(3)) + "</h4>"; }
        else if (line.startsWith("# ")) { if (inList) { html += "</ul>"; inList = false; } html += "<h3>" + inline(line.slice(2)) + "</h3>"; }
        else if (line.startsWith("> ")) { html += "<blockquote>" + inline(line.slice(2)) + "</blockquote>"; }
        else if (line.startsWith("- ")) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(line.slice(2)) + "</li>"; }
        else { if (inList) { html += "</ul>"; inList = false; } if (line.trim()) html += "<p>" + inline(line) + "</p>"; }
      }
      if (inList) html += "</ul>";
      return html;
    }

    function renderStats(s) {
      const c = s.counts || {}, st = L().stat;
      const cell = (n, label, hot) =>
        `<div class="stat ${hot && n > 0 ? "hot" : ""}"><div class="n" data-to="${n}">0</div><div class="l">${label}</div></div>`;
      document.getElementById("stats").innerHTML =
        cell(s.total, st.reviewed) + cell(c.attention || 0, st.attention, true) +
        cell(c.duplicates || 0, st.duplicates) + cell(c.ready || 0, st.ready) +
        cell(c.good_first || 0, st.good_first) + cell(c.more_info || 0, st.more_info);
      document.querySelectorAll(".stat .n").forEach(el => countUp(el, +el.dataset.to));
    }
    function countUp(el, to) {
      const start = performance.now(), dur = 550;
      (function step(t) {
        const p = Math.min(1, (t - start) / dur);
        el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      })(start);
    }

    function evidenceHtml(dec) {
      if (!dec || !dec.evidence || !dec.evidence.length) return "";
      return dec.evidence.map(e => {
        const w = e.weight || 0, cls = w > 0 ? "pos" : (w < 0 ? "neg" : "");
        const wtxt = w ? ` <span class="w ${cls}">(${w > 0 ? "+" : ""}${w.toFixed(2)})</span>` : "";
        return `<div class="ev"><span class="k">${esc(e.kind)}</span> · ${esc(e.detail)}${wtxt}</div>`;
      }).join("");
    }
    function agentBlock(r, name) {
      const d = agent(r, name);
      if (!d) return "";
      let extra = "";
      if (name === "responder" && d.data && d.data.draft)
        extra = `<div class="draft-label">${L().draft}</div><div class="draft">${esc(d.data.draft)}</div>`;
      return `<div class="agent"><div class="a-head"><span class="a-name">${tAgent(name)}</span>${tag(d.verdict)}<span class="conf">${L().conf} ${(d.confidence || 0).toFixed(2)}</span></div>
        <div class="rationale">${esc(d.rationale)}</div>${evidenceHtml(d)}${extra}</div>`;
    }
    const priClass = (p) => p === "high" ? "pri-high" : (p === "medium" ? "pri-med" : "");

    function itemRow(r) {
      const it = r.item;
      const tri = agent(r, "triage") || {}, qual = agent(r, "quality") || {};
      const slop = (qual.data && qual.data.slop_score) || 0;
      const labels = (action(r, "add_labels")?.payload.labels) || [];
      const pri = (tri.data && tri.data.priority) || "-";
      const kindLabel = it.kind === "pull_request" ? "PR" : "issue";
      let qualCell = "";
      if (qual.verdict && qual.verdict !== "not-applicable") {
        qualCell = `${tag(qual.verdict)}<span class="meter t-${tone(qual.verdict)}"><i style="width:${Math.round(slop * 100)}%"></i></span><span class="score mono">${slop}</span>`;
      }
      const chips = labels.map(l => `<span class="chip t-${tone(l)}"><i class="dot"></i>${esc(tV(l))}</span>`).join("");
      const agents = ["triage", "quality", "reproducer", "responder"].map(a => agentBlock(r, a)).join("");
      const acts = r.actions.map(a => a.type).join(", ");
      return `<div class="item">
        <div class="row" onclick="this.parentNode.classList.toggle('open')">
          <span class="num mono">#${it.number}</span><span class="kind mono">${kindLabel}</span>
          <span class="title">${esc(it.title)}</span>
          <span class="meta"><span class="pri mono ${priClass(pri)}">${esc(tPri(pri))}</span>${tag(tri.verdict || "-")}${qualCell}<span class="chev">›</span></span>
        </div>
        <div class="body"><div class="chips">${chips}</div>${agents}<div class="approval mono">${L().proposed}${acts}</div></div>
      </div>`;
    }

    function renderData() {
      const d = state.data; if (!d) return;
      document.getElementById("status").innerHTML =
        `${L().st.source} <b>${esc(d.offline ? "sample" : d.repo)}</b> &nbsp; ${L().st.backend} <b>${esc(d.backend)}</b>` +
        ` &nbsp; ${L().st.llm} <b>${esc(d.llm)}</b> &nbsp; ${L().st.run} <b>${esc(d.run_id)}</b> &nbsp; ${d.count} ${L().st.items}`;
      renderStats(d.stats);
      document.getElementById("items").innerHTML = d.results.map(itemRow).join("");
      document.getElementById("digest").innerHTML = renderMarkdown(d.digest_md);
    }
    function applyStatic() {
      const t = L();
      document.getElementById("tagline").textContent = t.tagline;
      document.getElementById("repo").placeholder = t.placeholder;
      document.getElementById("go").textContent = t.analyze;
      document.getElementById("demo").textContent = t.demo;
      document.getElementById("hint").textContent = t.hint;
      document.getElementById("col-title").textContent = t.listTitle;
      document.getElementById("digest-title").textContent = t.digestTitle;
      document.getElementById("footer-text").textContent = t.footer;
      document.getElementById("source-link").textContent = t.source;
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
      [...document.querySelectorAll("#lang button")].forEach(b => b.classList.toggle("active", b.dataset.lang === state.lang));
    }
    async function analyze(repo) {
      state.repo = repo;
      const items = document.getElementById("items");
      items.innerHTML = `<div class="loading">${repo ? L().loading : L().loadingDemo}</div>`;
      document.getElementById("status").textContent = "";
      try {
        const q = "?lang=" + state.lang + (repo ? "&repo=" + encodeURIComponent(repo) : "");
        const res = await fetch("/api/run" + q);
        if (!res.ok) throw new Error("HTTP " + res.status);
        state.data = await res.json();
        renderData();
      } catch (e) {
        items.innerHTML = `<div class="loading">${L().errPre}${esc(String(e))}${L().errSuf}</div>`;
      }
    }
    function setLang(lang) {
      state.lang = lang;
      try { localStorage.setItem("ma_lang", lang); } catch (e) {}
      applyStatic(); analyze(state.repo);
    }

    document.getElementById("go").onclick = () => analyze(document.getElementById("repo").value.trim());
    document.getElementById("demo").onclick = () => { document.getElementById("repo").value = ""; analyze(""); };
    document.getElementById("repo").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("go").click(); });
    document.getElementById("lang").addEventListener("click", e => {
      const b = e.target.closest("button"); if (b && b.dataset.lang !== state.lang) setLang(b.dataset.lang);
    });
    document.getElementById("theme").addEventListener("click", toggleTheme);

    (function init() {
      let saved = null;
      try { saved = localStorage.getItem("ma_lang"); } catch (e) {}
      state.lang = saved || ((navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en");
      try {
        if (!localStorage.getItem("ma_theme")) {
          matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
            document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light"); paintThemeIcon();
          });
        }
      } catch (e) {}
      paintThemeIcon(); applyStatic(); analyze("");
    })();
  </script>
</body>
</html>
