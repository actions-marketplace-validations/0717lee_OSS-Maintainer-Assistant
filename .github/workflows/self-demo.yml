name: Maintainer digest (self-demo)

# Dogfooding: run maintainer-agent on this very repository and publish a
# read-only digest to the workflow summary. Weekly + on demand.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run maintainer-agent on this repo
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
